name: Release

# Hand-written release pipeline, dispatched by hand. One workflow ships three kinds of build:
#
#   release    `X.Y.Z`, the Cargo.toml version, from refs/heads/main. Readiness gate, six platforms signed and
#              attested, then tag `vX.Y.Z` and the GitHub release, the index announce, the prune of old
#              candidates, and the docker and sdkgen publishes.
#   candidate  `X.Y.Z-rcN` of the same Cargo.toml version, from refs/heads/main. As a release, but a
#              GitHub pre-release, an ephemeral index row, and no docker or sdkgen.
#   dev        a build of the dispatched branch to the dev package: nothing but that package changes
#              (no git tag, no GitHub release, no announce, no docker, no sdkgen). Old dev builds are pruned.
#
#   verify-version -> plan -> cross -> build -> scan -> publish -> github-release -> announce -> post-*
#                       \-> readiness (release, candidate) ----^         \-> prune-dev | prune
#
# Signing identity. Every signature and attestation of the package is made by the `publish` job of this
# file (never by a called workflow, whose certificate would name the called file), so the certificate
# says `<repo>/.github/workflows/release.yml@<ref>`: `refs/heads/main` for a release or a candidate.
# `publish` verifies each platform against that identity before anything else runs. `backfill.yml` is the
# second identity, for versions published before this workflow signed.
#
# The tag `vX.Y.Z` is created by `github-release`, after `publish` has signed, never before. The floating
# tags move even later: `publish` pushes all six platforms to the one build tag without `--cascade`, signs and
# attests each, verifies every platform, and only then runs `ocx package cascade repair` (scoped to that build
# tag) to write `X.Y.Z`, `X.Y`, `X` and `latest`, or the candidate's and the dev build's rolling tags. No
# floating tag a user installs from therefore moves before every platform is pushed, signed, attested and verified.
#
# Repository values live in the one `env:` block below. This is the e2e-package copy of ocx's release.yml: it differs
# in that block, in the build jobs (a Rust fixture on two native runners, and an ocx built from `ocx_repository` at
# `ocx_ref`), and in what it leaves out (readiness, the GitHub release and tag, docker, sdkgen: a `v*` tag would
# dispatch `release-tag.yml`). Announce writes `--output index-out` as an artifact and opens no request.

run-name: "release ${{ inputs.mode }}${{ inputs.mode != 'dev' && format(' {0}', inputs.version) || '' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to ship.
        required: true
        type: choice
        options:
          - release
          - candidate
          - dev
      version:
        description: >-
          release: X.Y.Z (the Cargo.toml version). candidate: X.Y.Z-rcN, same X.Y.Z. dev: ignored.
        required: false
        type: string
        default: ''
      ocx_repository:
        description: Repository to build ocx from (ocx-sh/ocx or ocx-sh/e2e-index).
        required: true
        type: string
        default: ocx-sh/ocx
      ocx_ref:
        description: Full 40-character commit SHA of that repository.
        required: true
        type: string
      prune_after_days:
        description: >-
          Age in days before a dev build (dev mode) or a candidate of a released version (release mode) is pruned.
        required: false
        type: number
        default: 30

permissions: {}

env:
  REPOSITORY_ID: "1455949009"
  # The ocx-specific `readiness` job is not part of this copy.
  READINESS: "false"
  PACKAGE_RELEASE: ghcr.io/ocx-sh/e2e-package
  PACKAGE_DEV: ghcr.io/ocx-sh/dev/e2e-package
  # The package as the index and its users name it; the physical home is `PACKAGE_RELEASE`.
  PACKAGE_LOGICAL: e2e.ocx.sh/e2e/release
  # Where announce looks for the committed root; the Pages site of the same repository serves it.
  INDEX_REPO: ocx-sh/e2e-index
  INDEX_PACKAGE: e2e/release
  INDEX_URL: https://ocx-sh.github.io/e2e-index
  # Whitespace-separated rows of `<asset triple> <OCI platform>`.
  PLATFORMS: |
    x86_64-unknown-linux-gnu linux/amd64+libc.glibc
    aarch64-unknown-linux-gnu linux/arm64+libc.glibc
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  # The identity a release or a candidate is verified against, pinned here rather than derived from the run: a
  # run from any other ref cannot pass its own self-verify. A dev build runs from any branch and verifies
  # against its own workflow ref instead.
  RELEASE_IDENTITY: ${{ github.server_url }}/ocx-sh/e2e-package/.github/workflows/release.yml@refs/heads/main

concurrency:
  group: release-${{ inputs.mode }}
  # A half-published release is worse than a queued one.
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.plan.outputs.semver }}
      tag: ${{ steps.plan.outputs.tag }}
      package: ${{ steps.plan.outputs.package }}
      git_tag: ${{ steps.plan.outputs.git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan the build
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          REPOSITORY_ID_ACTUAL: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID_ACTUAL" != "$REPOSITORY_ID" ]]; then
            echo "::error::this workflow publishes only from the repository it was written for (id $REPOSITORY_ID)"
            exit 1
          fi
          # Freeze the UTC build stamp once: every platform push below lands on one tag.
          ts="$(date -u +%Y%m%d%H%M%S)"
          case "$MODE" in
            release | candidate)
              if [[ "$MODE" == candidate ]]; then
                shape='^[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$'
              else
                shape='^[0-9]+\.[0-9]+\.[0-9]+$'
              fi
              if ! [[ "$VERSION" =~ $shape ]]; then
                echo "::error::version '$VERSION' does not fit a $MODE (expected $shape)"
                exit 1
              fi
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::release and candidate run only from refs/heads/main (this run is $GITHUB_REF)"
                exit 1
              fi
              if git rev-parse --quiet --verify "refs/tags/v${VERSION}" >/dev/null; then
                echo "::error::tag v${VERSION} already exists"
                exit 1
              fi
              semver="$VERSION"
              tag="${VERSION}_${ts}"
              package="$PACKAGE_RELEASE"
              git_tag="v${VERSION}"
              ;;
            dev)
              core="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
              if [[ -z "$core" ]]; then
                echo "::error::no version in Cargo.toml"
                exit 1
              fi
              # `+` is not an OCI reference character; the binary embeds the semver form, the package carries `_`.
              semver="${core}-dev+${ts}"
              tag="${core}-dev_${ts}"
              package="$PACKAGE_DEV"
              git_tag=""
              ;;
            *)
              echo "::error::mode '$MODE' is not release, candidate or dev"
              exit 1
              ;;
          esac
          {
            echo "semver=$semver"
            echo "tag=$tag"
            echo "package=$package"
            echo "git_tag=$git_tag"
          } >> "$GITHUB_OUTPUT"

  # The ocx that publishes, announces and prunes, built from the named source; no credential in this job.
  ocx:
    name: Build ocx
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ocx
        uses: ./.github/actions/build-ocx
        with:
          repository: ${{ inputs.ocx_repository }}
          ref: ${{ inputs.ocx_ref }}
      - name: Upload ocx
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocx-bin
          path: /usr/local/bin/ocx
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # One native runner per platform (the arm64 runner is not a cross-build). No credential in these jobs.
  build:
    name: Build ${{ matrix.asset }}
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - asset: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.6'
          project: ''
          cache: false
      - name: Build the binary and its SBOM
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          scripts/build.sh
          mkdir -p "dist/e2e-package-${ASSET}"
          cp dist/pkg/bin/e2e-package "dist/e2e-package-${ASSET}/"
          tar -czf "dist/e2e-package-${ASSET}.tar.gz" -C dist "e2e-package-${ASSET}"
          cp dist/sbom-1.json "dist/e2e-package-${ASSET}.cdx.json"
      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ matrix.asset }}
          path: |
            dist/e2e-package-${{ matrix.asset }}.tar.gz
            dist/e2e-package-${{ matrix.asset }}.cdx.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The only job that signs or attests the package. Never move a signing step into a called workflow: the
  # certificate would name that workflow, not this file.
  publish:
    name: Publish and sign
    needs: [plan, ocx, build]
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && needs.ocx.result == 'success'
      && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release ocx
        uses: ./.github/actions/release-ocx
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-dist-*
          merge-multiple: true
          path: dist
      - name: Package, push and sign every platform
        env:
          MODE: ${{ inputs.mode }}
          PACKAGE: ${{ needs.plan.outputs.package }}
          TAG: ${{ needs.plan.outputs.tag }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags_file="$GITHUB_WORKSPACE/published-tags.txt"
          : > "$tags_file"
          # No `--cascade`: the floating tags move in the last step of this job, after the verify.
          flags=(--sign --tags-file "$tags_file"
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}")
          # Only a release pins its manifests with a keep tag; a candidate or a dev build stays removable.
          [[ "$MODE" == release ]] || flags+=(--no-keep-tag)
          while read -r asset platform; do
            [[ -n "$asset" ]] || continue
            stage="$(mktemp -d)"
            tar -xzf "dist/e2e-package-${asset}.tar.gz" -C "$stage"
            binary="$stage/e2e-package-${asset}/e2e-package"
            scripts/publish_ocx_package.sh \
              --identifier "${PACKAGE}:${TAG}" \
              --platform "$platform" \
              --binary "$binary" \
              --sbom "dist/e2e-package-${asset}.cdx.json" \
              "${flags[@]}"
            rm -rf "$stage"
          done <<< "$PLATFORMS"
      - name: Verify every platform against this workflow's identity
        env:
          MODE: ${{ inputs.mode }}
          PACKAGE: ${{ needs.plan.outputs.package }}
          TAG: ${{ needs.plan.outputs.tag }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == dev ]]; then
            identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          else
            identity="$RELEASE_IDENTITY"
          fi
          while read -r asset platform; do
            [[ -n "$asset" ]] || continue
            ocx package verify -p "$platform" \
              --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${PACKAGE}:${TAG}"
            ocx package verify -p "$platform" --attestation --type cyclonedx \
              --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${PACKAGE}:${TAG}"
          done <<< "$PLATFORMS"
      # The one place a floating tag is written. Every platform above is pushed under the build tag, signed,
      # attested and verified before this step runs, so no floating tag moves before then; `cascade repair` only
      # re-points tags at content the registry already serves (it uploads nothing) and is scoped to this build tag.
      # It also appends the tags it moved to the file `announce` reads.
      - name: Move the floating tags
        env:
          PACKAGE: ${{ needs.plan.outputs.package }}
          TAG: ${{ needs.plan.outputs.tag }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags_file="$GITHUB_WORKSPACE/published-tags.txt"
          ocx package cascade repair --tags-file "$tags_file" "${PACKAGE}:${TAG}"
      - name: Upload the published tags
        if: ${{ inputs.mode != 'dev' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-tags
          path: published-tags.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  announce:
    name: Announce
    if: ${{ inputs.mode != 'dev' }}
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release ocx
        uses: ./.github/actions/release-ocx
      - name: Download the published tags
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-tags
          path: ${{ runner.temp }}/tags
      - name: Announce into the index
        env:
          MODE: ${{ inputs.mode }}
          TAGS_FILE: ${{ runner.temp }}/tags/published-tags.txt
        run: |
          set -euo pipefail
          if [[ ! -s "$TAGS_FILE" ]]; then
            echo "::error::publish recorded no tags; refusing to announce nothing"
            exit 1
          fi
          # No request and no credential: the entry is written under index-out and committed by hand.
          flags=(--tags-file "$TAGS_FILE" --index-repo "$INDEX_REPO" --output index-out)
          # A candidate's row is removable without review; prune frees it later.
          [[ "$MODE" == candidate ]] && flags+=(--ephemeral)
          ocx package announce "${flags[@]}" "$INDEX_PACKAGE"
      - name: Upload the index entry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-out
          path: index-out
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Dev builds only: the one place `--force` is allowed, because the dev package has no index to mark a tag
  # ephemeral and its tags are all disposable.
  prune-dev:
    name: Prune old dev builds
    if: ${{ inputs.mode == 'dev' }}
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release ocx
        uses: ./.github/actions/release-ocx
      - name: Prune dev builds past their age
        env:
          PACKAGE: ${{ env.PACKAGE_DEV }}
          DAYS: ${{ inputs.prune_after_days }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ocx --remote --format json index list "$PACKAGE" | jq -r '.items[].tags[]?' > "$RUNNER_TEMP/tags.txt"
          python3 scripts/release_prune_select.py dev --days "$DAYS" < "$RUNNER_TEMP/tags.txt" > "$RUNNER_TEMP/selected.txt"
          mapfile -t selected < "$RUNNER_TEMP/selected.txt"
          if ((${#selected[@]} == 0)); then
            echo "No dev build of $PACKAGE is older than $DAYS days."
            exit 0
          fi
          ocx package prune --forge github --force --tags-file "$RUNNER_TEMP/pruned.txt" "$PACKAGE" "${selected[@]}"

  # Release mode only: the candidates of a version that has shipped, once it is old enough. Their index rows
  # are ephemeral, so prune needs no `--force`; the announce then drops the rows of the tags that are gone.
  prune:
    name: Prune old candidates
    if: ${{ inputs.mode == 'release' }}
    needs: [plan, announce]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release ocx
        uses: ./.github/actions/release-ocx
      - name: Prune candidates of old releases
        env:
          DAYS: ${{ inputs.prune_after_days }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The logical name resolves through the index this repository serves.
          export OCX_CONFIG="$RUNNER_TEMP/ocx-config.toml"
          printf '[registries."e2e.ocx.sh"]\nindex = "%s"\n' "$INDEX_URL" > "$OCX_CONFIG"
          ocx --remote --format json index list "$PACKAGE_RELEASE" | jq -r '.items[].tags[]?' > "$RUNNER_TEMP/tags.txt"
          python3 scripts/release_prune_select.py candidates --days "$DAYS" < "$RUNNER_TEMP/tags.txt" > "$RUNNER_TEMP/selected.txt"
          mapfile -t selected < "$RUNNER_TEMP/selected.txt"
          if ((${#selected[@]} == 0)); then
            echo "No candidate of a release older than $DAYS days."
            exit 0
          fi
          ocx package prune --forge github --tags-file "$RUNNER_TEMP/pruned.txt" "$PACKAGE_LOGICAL" "${selected[@]}"
          ocx package announce --tags-from-registry --index-repo "$INDEX_REPO" --output index-out "$INDEX_PACKAGE"
      - name: Upload the index entry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-out-prune
          path: index-out
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
