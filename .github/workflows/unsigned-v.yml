name: unsigned-v

# Publishes :0.0.1, a version tag with no signature and no attestation: the subject `backfill.yml` signs afterwards.
on:
  workflow_dispatch:

permissions: {}

jobs:
  unsigned-v:
    if: github.repository_id == '1455949009' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.6'
          project: ''
          cache: false
      - name: Build
        run: scripts/build.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh 0.0.1 none 0
