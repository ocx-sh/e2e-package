name: key-sign

# Publishes :key signed with a key pair instead of keyless. Deliberately no id-token grant.
# Secrets E2E_SIGNING_KEY (cosign encrypted key PEM) and E2E_SIGNING_KEY_PASSWORD, by name only.
on:
  workflow_dispatch:

permissions: {}

jobs:
  key-sign:
    if: github.repository_id == '1455949009' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.6'
          project: ''
          cache: false
      - name: Build
        run: scripts/build.sh
      - name: Publish, sign with the key, self-verify
        env:
          GH_TOKEN: ${{ github.token }}
          OCX_SIGNING_KEY: ${{ secrets.E2E_SIGNING_KEY }}
          OCX_KEY_PASSWORD: ${{ secrets.E2E_SIGNING_KEY_PASSWORD }}
        run: scripts/publish.sh key key 0
